name: Testes de acesso ao laboratorio
on:
  push:
    branches:
      - feature/acesso-ricardo-laboratorio-transformacoes
    paths:
      - 'app.py'
      - 'core/permissoes.py'
      - 'tests/test_permissao_laboratorio_transformacoes.py'
  pull_request:
    paths:
      - 'app.py'
      - 'core/permissoes.py'
      - 'tests/test_permissao_laboratorio_transformacoes.py'
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q app.py core/permissoes.py tests/test_permissao_laboratorio_transformacoes.py
      - run: python -m unittest discover -s tests -p 'test_permissao_laboratorio_transformacoes.py' -v
