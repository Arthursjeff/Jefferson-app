name: Testes laboratorio transformacoes
on:
  push:
    branches:
      - feature/laboratorio-transformacoes-v1
      - main
    paths:
      - 'core/motor_transformacoes.py'
      - 'modules/laboratorio_transformacoes.py'
      - 'tests/test_motor_transformacoes.py'
      - '.github/workflows/test-transformacoes.yml'
  pull_request:
    paths:
      - 'core/motor_transformacoes.py'
      - 'modules/laboratorio_transformacoes.py'
      - 'tests/test_motor_transformacoes.py'
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q core/motor_transformacoes.py modules/laboratorio_transformacoes.py tests/test_motor_transformacoes.py
      - run: python -m unittest discover -s tests -p 'test_motor_transformacoes.py' -v
