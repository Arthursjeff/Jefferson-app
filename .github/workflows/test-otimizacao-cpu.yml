name: Validar otimizacao CPU da fila
on:
  push:
    branches:
      - optimizacao-cpu-supabase-20261020
      - main
    paths:
      - app.py
      - core/fila_revisao.py
      - core/notificacoes.py
      - core/pedidos.py
      - modules/modulo_01/**
      - modules/inteligencia_comercial_v2.py
      - modules/consulta_fotos.py
      - modules/analises.py
      - tests/test_otimizacao_cpu.py
      - .github/workflows/test-otimizacao-cpu.yml
  pull_request:
    paths:
      - app.py
      - core/**
      - modules/**
      - tests/test_otimizacao_cpu.py
      - .github/workflows/test-otimizacao-cpu.yml
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar sintaxe de todos os modulos
        run: python -m compileall -q app.py core modules components tests
      - name: Inicializacao real do Streamlit sem login
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          tela = AppTest.from_file("app.py", default_timeout=30).run()
          assert not tela.exception, [str(x.message) for x in tela.exception]
          PY
      - name: Testar otimizacao da fila
        run: python -m unittest discover -s tests -p 'test_otimizacao_cpu.py' -v
      - name: Testar regressoes existentes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
